name: SauceDemo Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Browsers
      run: npx playwright install --with-deps
    - name: Run tests
      run: npm test
      env:
          BASE_URL_UI: ${{ secrets.BASE_URL_UI }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          LOGIN_STANDARD: ${{ secrets.LOGIN_STANDARD }}
          LOGIN_LOCKED: ${{ secrets.LOGIN_LOCKED }}
          LOGIN_PROBLEM: ${{ secrets.LOGIN_PROBLEM }}
          LOGIN_PERFORMANCE: ${{ secrets.LOGIN_PERFORMANCE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_EMAIL: ${{ secrets.API_EMAIL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          API_X_KEY: ${{ secrets.API_X_KEY }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: test-results/**/*.png

    - name: Upload videos on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: videos
        path: test-results/**/*.webm
